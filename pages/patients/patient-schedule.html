<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareConnectLite</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header>
    <nav>
        <a href="/">CareConnectLite</a>
        <ul>
          <li><a href="/patients/account">My Appointments</a></li>
          <li><a id="logout">Log Out</a></li>
        </ul>
    </nav>
  </header>
  <main>
    <h1>Browse Available Appointments</h1>
    <div id="feedback"></div>
    <div id="available-appointments"></div>


    <!--MODAL FORM FOR LOGOUT-->
    <dialog id="logoutModal">
      <form action="/logout" method="POST" id="logoutModalForm">
        <h3>Are You Sure You Want Log Out?</h3>
        <div class="modal-actions">
          <button type="button" id="closelogoutModalBtn">Cancel</button>
          <button type="submit">Yes, Log out</button>
        </div>
      </form>
    </dialog>
  </main>

  <!--MODAL FORM FOR BOOKING-->
  <dialog id="bookingModal">
    <form action="/patients/appointments/book" method="POST" id="bookingForm">
      <h3>Select Appointment Type</h3>
      <select name="appointmentType" id="appointmentType" required>
        <option value="Virtual">Virtual</option>
        <option value="In-person">In-person</option>
      </select>
      <input type="hidden" name="ID" id="appointmentID">
      <div class="modal-actions">
        <button type="button" id="closeBookingModalBtn">Cancel</button>
        <button type="submit">Book Appointment</button>
      </div>
    </form>
  </dialog>
</main>

  <!--FOOTER-->
  <footer><p>&copy; 2026 CareConnectLite</p></footer>
  <script>
    //DIV FOR FEEDBACK FROM RESPONSES
    const feedback = document.getElementById("feedback");

    //MODAL FORM FOR LOG OUT
    const modal = document.getElementById('logoutModal');
    const logoutBtn = document.getElementById('logout');
    const closeBtn = document.getElementById('closelogoutModalBtn');
    // Open the modal
    logoutBtn.addEventListener('click', () => {
    modal.showModal();
    });
    // Close the modal manually with cancel button
    closeBtn.addEventListener('click', () => {
    modal.close(); 
    });

    //MODAL FORM FOR BOOKING
    const bookingModal = document.getElementById('bookingModal');
    const closeBookingBtn = document.getElementById(`closeBookingModalBtn`);
    const bookingForm = document.getElementById("bookingForm");
    const bookingID = document.getElementById("appointmentID");
    bookingForm.addEventListener("submit", async e=>{
      e.preventDefault();
      await book(bookingID.value);
    });
    closeBookingBtn.addEventListener("click", () => {
      bookingModal.close();
    });

    //get parameters
    const params = new URLSearchParams(window.location.search);

    //FETCH AVAILABLE APPOINTMENTS
    async function getAvailableAppointments(){
      const res = await fetch("/patients/schedule/search");
      const result = await res.json();
      const appointmentSection = document.getElementById("available-appointments");

      if(result.success){
        const appointments = result.appointments;
        const user = result.user;
        //handle no appointments
        if (!appointments || appointments.length === 0) {
          appointmentSection.innerHTML = `
            <p>No Appointments Currently. Check back soon.</p>
          `;
          return;
        }
        //handle a list of appointments

        //hashmap with array of appointments for each date
        const appointmentsByDate = {};
        appointments.forEach(appointment => {
          const [date] = appointment.datetime.split(' ');
          if (!appointmentsByDate[date]) appointmentsByDate[date] = [];
          appointmentsByDate[date].push(appointment);
        });

        //Group appointments by date
        appointmentSection.innerHTML = Object.keys(appointmentsByDate).map(date => {
          const formatDate = new Date(`${date}T00:00:00`);
          const weekday = formatDate.toLocaleDateString('en-US', { weekday: 'long' });
          //Generate HTML of appointment cards within a date
          const appointmentCards = appointmentsByDate[date].map(appointment => {
            const [date, time] = appointment.datetime.split(' ');
            if(appointment.currentStatus != "Available" || appointment.datetime < getDate()){
              return `
                <section class="booking-card">
                  <div>
                    <p>Time: ${time}</p>
                  </div>
                  <button type="button" onclick="" disabled>
                    Unavailable
                  </button>
                </section>
              `;
            } else{
              return `
              <section class="booking-card">
                <div>
                  <p>Time: ${time}</p>
                </div>
                <button id="bookingBtn" type="button" onclick="setBookingForm(${appointment.appointmentID})">
                  Book Appointment
                </button>
              </section>
            `;
            }
            
          }).join('');

          //Render all HTML by date
          return `
            <div class="appointment-day${weekday=="Monday"?' monday':''}">
              <h3>${weekday}, ${date}</h3>
              ${appointmentCards}
            </div>
          `;
        }).join('');
        
      } else {
        feedback.innerText = "Failed to get appointments."
      }
    }

    //BOOK APPOINTMENTS
    async function book(appointmentID){
      const bookingFormData = new FormData(bookingForm);
      const bookingData = Object.fromEntries(bookingFormData);
      const res = await fetch("/patients/appointments/book", {
        method: "POST",
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(bookingData)
      });
      const result = await res.json();
      if(result.success){
        alert(`Successfully booked appointment #: ${appointmentID}`);
        window.location.href = "/patients/account";
      } else {
        alert("Failed to book appointment.");
        window.location.reload();
      }

    }

    function setBookingForm(appointmentID){
      // Open the modal
      bookingModal.showModal();
      //Set ID
      bookingID.value = appointmentID;
    }

    function getDate(){
    //get current date in format (yyyy-mm-dd hh:mm:ss)
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const formattedDate = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    return formattedDate;
}

    getAvailableAppointments();
    


  </script>
</body>
</html>
