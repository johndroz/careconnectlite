<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareConnectLite</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header>
    <nav>
        <a href="index.html">CareConnectLite</a>
        <ul>
          <li><a href="/patients/account">My Appointments</a></li>
          <li><a href="/patients/schedule">Book Appointments</a></li>
            <li><a id="logout">Log Out</a></li>
        </ul>
    </nav>
  </header>
  <h1>Patient: View Appointment Details</h1>
  <div id="feedback"></div>

  <!--APPOINTMENT DETAILS-->
  <main class="appointment-details">
    <div id="appointment-details"></div>

      <!--MODAL FORM FOR LOGOUT-->
      <dialog id="logoutModal">
        <form action="/logout" method="POST" id="logoutForm">
          <h3>Are You Sure You Want Log Out?</h3>
          <div class="modal-actions">
            <button type="button" id="closeModalBtn">Cancel</button>
            <button type="submit">Yes, Log out</button>
          </div>
        </form>
      </dialog>

      <!--MODAL FORM TO FILL INTAKE-->
      <dialog id="intakeModal">
        <form action="/patients/intake/create" method="POST" id="intakeForm">
            <h3>Appointment Intake Form</h3>
          
            <input id="appointmentID" name="appointmentID" type="hidden">
            <div class="intake-row">
                <label class="left-align" for="appointmentReason">Appointment Reason</label>
                <select id="appointmentReason" name="appointmentReason" required>
                <option value="">Select a reason</option>
                <option value="Wellness Exam">Wellness Exam</option>
                <option value="Follow-up Visit">Follow-up Visit</option>
                <option value="New Patient Consultation">New Patient Consultation</option>
                <option value="Sick Visit">Sick Visit</option>
                <option value="Chronic Disease Management">Chronic Disease Management</option>
                <option value="Medication Management">Medication Management</option>
                <option value="Preventative Screening / Lab Work">Preventative Screening / Lab Work</option>
                </select>
            </div>
            <div class="intake-row">
                <label class="left-align" for="symptoms">Symptoms</label>
                <textarea id="symptoms" name="symptoms" maxlength="100" placeholder="Describe symptoms, if any"></textarea>
            </div>
            <div class="intake-row">
                <label class="left-align" for="patientComments">Additional Comments</label>
                <textarea id="patientComments" name="patientComments" maxlength="250" placeholder="Any additional information for the provider"></textarea>
            </div>
            <div class="intake-row">
                <button type="submit">Submit Intake</button>
                <button type="button" id="cancelIntake">Cancel</button>
            </div>
          </form>
      </dialog>

  </main>

  <!--FOOTER-->
  <footer>
    <p>&copy; 2026 CareConnectLite</p>
  </footer>

  <script>
    //get parameters
    const params = new URLSearchParams(window.location.search);
    

    //get feedback from responses
    const feedback = document.getElementById("feedback");
    const intakeSubmitted = params.get("intakeSubmitted");
    if(intakeSubmitted == "false") feedback.innerText = "Intake was not submitted."
    if(intakeSubmitted == "true") feedback.innerText = "Intake was submitted successfully."

    //MODAL FORM FOR LOG OUT
    const logoutModal = document.getElementById('logoutModal');
    const logoutBtn = document.getElementById('logout');
    const logoutClose = document.getElementById('closeModalBtn');
    // Open the modal
    logoutBtn.addEventListener('click', () => {
      logoutModal.showModal();
    });
    // Close the modal manually with cancel button
    logoutClose.addEventListener('click', () => {
      logoutModal.close(); 
    });

    
    //CONFIRM APPOINTMENT
    async function confirm(ID){
      const res = await fetch("/patients/appointments/confirmation", {
        method: "POST",
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({'ID': ID})
      });
      const result = await res.json();
      if(result.success){
        alert(`Confirmed appointment ID: ${ID}`);
        window.location.reload();
      } else {
        feedback.innerHTML = "Failed to confirm."
      }
    }

    //SUBMIT INTAKE
    async function intake(ID){

    }


    //GET APPOINTMENT DETAILS
    //get ID search parameters
    const appointmentID = params.get("ID");
    const appointmentIDField = document.getElementById("appointmentID");
    appointmentIDField.value = appointmentID;

    async function loadAppointmentDetails(){
      const res = await fetch(`/patients/appointments/details/search?ID=${appointmentID}`);
      const result = await res.json();
      const currentAppointment = document.getElementById("appointment-details")
      
      //Retrieve successfully logged in patient info
      if(result.success){
        const user = result.user;
        const appointment = result.appointment;
        //handle no appointments
        if (!appointment || appointment.length === 0) {
            currentAppointment.innerHTML = `
            <p>No Appointment Details Found.</p>
            <a href="/patients/appointments">Search All Appointments</a>
          `;
          return;
        }
        //handle a list of appointments
        const [date, time] = appointment.datetime.split(' ');
        currentAppointment.innerHTML = `
        <section class="appointment-details-card">
            <div>
            Appointment # ${appointment.appointmentID}: <strong>${appointment.currentStatus}</strong>
            <ul class="left-align">
                <li>Provider: <u>${appointment.providerFirstName} ${appointment.providerLastName}</u></li>
                <li>Appointment Type: ${appointment.appointmentType || 'Not selected yet'}</li>
                <li>Date: ${date}</li>
                <li>Time: ${time}</li>
                <li>Patient: ${appointment.patientFirstName} ${appointment.patientLastName}</li>
            </ul>
            </div>
            <div class="appointment-card-buttons">
            <button id="confirm" onclick="confirm(${appointment.appointmentID})" disabled></button>
            <button id="intake" onclick"intake(${appointment.appointmentID})" disabled></button>
        </div>
        </section>
        `;

        const confirmBtn = document.getElementById(`confirm`);
        const intakeBtn = document.getElementById(`intake`);
        const confirmationRequested = appointment.confirmationRequested;
        const intakeSubmitted = appointment.intakeSubmitted;
        if(confirmationRequested == 0 || (confirmationRequested == 1 && appointment.currentStatus != "Booked")) confirmBtn.innerText = "Not Confirmed"
        if(appointment.currentStatus == "Confirmed") confirmBtn.innerText = "Appointment Confirmed";
        if(confirmationRequested == 1 && appointment.currentStatus == "Booked"){
            confirmBtn.innerText = "Confirm Appointment";
            confirmBtn.disabled = false;
        } 
        if(intakeSubmitted == 1) intakeBtn.innerText = "Intake Submitted";
        if(intakeSubmitted == 0) intakeBtn.innerText = "Intake not Completed"
        if(intakeSubmitted == 0 && appointment.currentStatus == "Confirmed"){
            intakeBtn.innerText = "Submit Intake";
            intakeBtn.disabled = false;
        } 

        //MODAL FORM FOR INTAKE SUBMISSION
        const intakeModal = document.getElementById('intakeModal');
        const intakeClose = document.getElementById('cancelIntake');
        const appointmentReason = document.getElementById('appointmentReason');
        // Open the modal
        intakeBtn.addEventListener('click', () => {
            if(!appointmentReason.required) appointmentReason.required = true;
            intakeModal.showModal();
        });
        // Close the modal manually with cancel button
        intakeClose.addEventListener('click', () => {
            if(appointmentReason.required) appointmentReason.required = false;
            intakeModal.close(); 
        });
       
      }
    }

    loadAppointmentDetails();

  </script>
</body>
</html>
