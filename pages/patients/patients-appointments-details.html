<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareConnectLite</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header>
    <nav>
        <a href="index.html">CareConnectLite</a>
        <ul>
          <li><a href="/patients/account">My Appointments</a></li>
          <li><a href="/patients/appointments">Book Appointments</a></li>
            <li><a id="logout">Log Out</a></li>
        </ul>
    </nav>
  </header>
  <h1>Patient: View Appointment Details</h1>
  <div id="feedback"></div>

  <!--APPOINTMENT DETAILS-->
  <main class="appointment-details">
    <div id="appointment-details"></div>

      <!--MODAL FORM FOR LOGOUT-->
      <dialog id="logoutModal">
        <form action="/logout" method="POST" id="logoutForm">
          <h3>Are You Sure You Want Log Out?</h3>
          <div class="modal-actions">
            <button type="button" id="closeModalBtn">Cancel</button>
            <button type="submit">Yes, Log out</button>
          </div>
        </form>
      </dialog>

  </main>

  <!--FOOTER-->
  <footer>
    <p>&copy; 2026 CareConnectLite</p>
  </footer>

  <script>
    //get parameters
    const params = new URLSearchParams(window.location.search);

    //get feedback from responses
    const feedback = document.getElementById("feedback");

    //MODAL FORM FOR LOG OUT
    const logoutModal = document.getElementById('logoutModal');
    const logoutBtn = document.getElementById('logout');
    const logoutClose = document.getElementById('closeModalBtn');
    // Open the modal
    logoutBtn.addEventListener('click', () => {
      logoutModal.showModal();
    });
    // Close the modal manually with cancel button
    logoutClose.addEventListener('click', () => {
      logoutModal.close(); 
    });
    
    //CONFIRM APPOINTMENT
    async function confirm(ID){
      const res = await fetch("/patients/appointments/confirmation", {
        method: "POST",
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({'ID': ID})
      });
      const result = await res.json();
      if(result.success){
        alert(`Confirmed appointment ID: ${ID}`);
        window.location.reload();
      } else {
        feedback.innerHTML = "Failed to confirm."
      }
    }

    //SUBMIT INTAKE
    async function intake(ID){

    }


    //GET APPOINTMENT DETAILS
    //get ID search parameters
    const appointmentID = params.get("ID");

    async function loadAppointmentDetails(){
      const res = await fetch(`/patients/appointments/details/search?ID=${appointmentID}`);
      const result = await res.json();
      const currentAppointment = document.getElementById("appointment-details")
      
      //Retrieve successfully logged in patient info
      if(result.success){
        const user = result.user;
        const appointment = result.appointment;
        //handle no appointments
        if (!appointment || appointment.length === 0) {
            currentAppointment.innerHTML = `
            <p>No Appointment Details Found.</p>
            <a href="/patients/appointments">Search All Appointments</a>
          `;
          return;
        }
        //handle a list of appointments
        const [date, time] = appointment.datetime.split(' ');
        currentAppointment.innerHTML = `
            <section class="appointment-details-card">
              <div>
                Appointment # ${appointment.appointmentID}: <strong>${appointment.currentStatus}</strong>
                <ul class="left-align">
                  <li>Provider: ${appointment.providerFirstName} ${appointment.providerLastName}</li>
                  <li>Appointment Type: ${appointment.appointmentType || 'Not selected yet'}</li>
                  <li>Date: ${date}</li>
                  <li>Time: ${time}</li>
                  <li>Patient: ${appointment.patientFirstName} ${appointment.patientLastName}</li>
                </ul>
              </div>
              <div class="appointment-card-buttons">
                <button id="confirm" onclick="confirm(${appointment.appointmentID})" disabled></button>
                <button id="intake" onclick"intake(${appointment.appointmentID})" disabled></button>
            </div>
            </section>
          `;

          const confirmBtn = document.getElementById(`confirm`);
          const intakeBtn = document.getElementById(`intake`);
          const confirmationRequested = appointment.confirmationRequested;
          const intakeSubmitted = appointment.intakeSubmitted;
          if(confirmationRequested == 0 || (confirmationRequested == 1 && appointment.currentStatus != "Booked")) confirmBtn.innerText = "Not Confirmed"
          if(appointment.currentStatus == "Confirmed") confirmBtn.innerText = "Appointment Confirmed";
          if(confirmationRequested == 1 && appointment.currentStatus == "Booked"){
            confirmBtn.innerText = "Confirm Appointment";
            confirmBtn.disabled = false;
          } 
          if(intakeSubmitted == 1) intakeBtn.innerText = "Intake Submitted";
          if(intakeSubmitted == 0) intakeBtn.innerText = "Intake not Completed"
          if(intakeSubmitted == 0 && appointment.currentStatus == "Confirmed"){
            intakeBtn.innerText = "Submit Intake";
            intakeBtn.disabled = false;
          } 

       

      }
    }

    loadAppointmentDetails();

  </script>
</body>
</html>
