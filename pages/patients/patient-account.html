<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareConnectLite</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header>
    <nav>
        <a href="/">CareConnectLite</a>
        <ul>
          <li><a href="/patients/schedule">Book Appointments</a></li>
          <li><a id="logout">Log Out</a></li>
        </ul>
    </nav>
  </header>
  <main>
    <div id="feedback"></div>

    <h2 id="greeting">Hello, </h2>
    <h3>Viewing All My Appointments</h3>
    <div id="my-appointments" class="appointments-section">
    </div>

    <!--MODAL FORM FOR LOGOUT-->
    <dialog id="inputModal">
      <form action="/logout" method="POST" id="modalForm">
        <h3>Are You Sure You Want Log Out?</h3>
        <div class="modal-actions">
          <button type="button" id="closeModalBtn">Cancel</button>
          <button type="submit">Yes, Log out</button>
        </div>
      </form>
    </dialog>

  </main>

  <!--FOOTER-->
  <footer><p>&copy; 2026 CareConnectLite</p></footer>

  <script>
    //DIV FOR FEEDBACK FROM RESPONSES
    const feedback = document.getElementById("feedback");

    //MODAL FORM FOR LOG OUT
    const modal = document.getElementById('inputModal');
    const logoutBtn = document.getElementById('logout');
    const closeBtn = document.getElementById('closeModalBtn');
    // Open the modal
    logoutBtn.addEventListener('click', () => {
    modal.showModal();
    });
    // Close the modal manually with cancel button
    closeBtn.addEventListener('click', () => {
    modal.close(); 
    });


    //GET APPOINTMENTS FOR SPECIFIC PATIENT
    async function loadPatient(){
      const res = await fetch("/patients/appointments");
      const result = await res.json();
      const greeting = document.getElementById("greeting");
      const myAppointments = document.getElementById("my-appointments")

      //Retrieve successfully logged in patient info
      if(result.success){
        const user = result.user;
        greeting.innerText = `Hello, ${user.firstName} ${user.lastName}`

        const appointments = result.appointments;
        //handle no appointments
        if (!appointments || appointments.length === 0) {
          myAppointments.innerHTML = `
            <p>No Appointments Currently.</p>
            <a href="/patients/schedule">Schedule an appointment</a>
          `;
          return;
        }
        //handle a list of appointments
        appointments.forEach(appt => {
          const appointmentCard = document.createElement("section");
          appointmentCard.classList.add("appointemnt-card");
          appointmentCard.innerHTML = 
          `<div class="left-align">
            <p><strong>Status:</strong> ${appt.currentStatus}</p>
            <p><strong>Date/Time:</strong> ${appt.datetime}</p>
            <p><strong>Type:</strong> ${appt.appointmentType || 'Not selected yet'}</p>
          </div>
          <div class="appointment-card-buttons">
            <div id="confirm${appt.appointmentID}"></div>
            <div id="intake${appt.appointmentID}"></div>
            <button onclick="window.location.href='/patients/appointments/details?ID=${appt.appointmentID}'">
                Appointment Details
              </button>
          </div>`

          myAppointments.appendChild(appointmentCard);
          //check intake and confirmation request status
          const confirmBtn = document.getElementById(`confirm${appt.appointmentID}`);
          const intakeBtn = document.getElementById(`intake${appt.appointmentID}`);
          const confirmationRequested = appt.confirmationRequested;
          const intakeSubmitted = appt.intakeSubmitted;
          if(confirmationRequested == 0 || (confirmationRequested == 1 && appt.currentStatus != "Booked")) confirmBtn.innerText = "Not Confirmed"
          if(appt.currentStatus == "Confirmed") confirmBtn.innerText = "Appointment Confirmed";
          if(confirmationRequested == 1 && appt.currentStatus == "Booked") confirmBtn.innerText = "Confirmation Required"
          if(intakeSubmitted == 1) intakeBtn.innerText = "Intake Submitted";
          if(intakeSubmitted == 0) intakeBtn.innerText = "Intake not Completed"
          if(intakeSubmitted == 0 && appt.currentStatus == "Confirmed") intakeBtn.innerText = "Intake Required";
        });  

      }
    }

    loadPatient();
  </script>
</body>
</html>
