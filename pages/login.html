<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareConnectLite</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <nav>
        <a href="index.html">CareConnectLite</a>
        <ul>
            <li><a href="signup">Register Patient Account?</a></li>
        </ul>
    </nav>
  </header>
  <main class="login-section">
    <h1>USER LOGIN</h1>
    <form id="login-form" name="login" action="login" method="POST" netlify>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Log In</button>
        <div id="login-error"></div>
      </form>

  </main>

  <!--FOOTER-->
  <footer><p>&copy; 2026 CareConnectLite</p></footer>
  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    const errorField = document.getElementById("login-error");
    if(error == "user") errorField.innerText = "No user associated with email."
    if(error == "invalid") errorField.innerText = "Invalid email or password."
  </script>
</body>
</html>
