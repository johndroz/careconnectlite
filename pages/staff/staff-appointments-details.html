<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareConnectLite</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header>
    <nav>
        <a href="index.html">CareConnectLite</a>
        <ul>
            <li><a href="staff">Current Appointments</a></li>
            <li><a href="logout">Log Out</a></li>
        </ul>
    </nav>
  </header>
  <h1>Appointment Details</h1>
  <div id="feedback"></div>
  <main class="appointment-details">
    <!--APPOINTMENT DETAILS-->
    <div>Appointment Detail Information (from database)</div>
    <section>
        <div class="left-align">
            <strong>Booked</strong>
            <ul>
                <li>Dr.Focaccia</li>
                <li>Virtual</li>
                <li>09/01/2026</li>
                <li>10:00 AM</li>
                <li>John Doe</li>
            </ul>
        </div>
        <div class="appointment-details-options">
            <button onclick="alert('A Confirmation Request has been sent to the patient.')">Request Confirmation</button>
            <button onclick="alert('An appointment intake form has been sent to the patient')">Send Intake Form</button>
            <button id="updateStatus">Update Appointment Status</button>
        </div>
    </section>

    <!--MODAL FORM STATUS UPDATES-->
    <dialog id="inputModal">
        <form action="/staff/appointments/updateStatus" method="POST" id="statusForm">
          <h3>Update Appointment Status</h3>
          
          <label for="appointmentStatus">Appointment Status:</label>
          <select type="text" id="appointmentStatus" name="appointmentStatus" required>
            <option>Available</option>
            <option>Booked</option>
            <option>Confirmed</option>
            <option>Checked in</option>
            <option>Complete</option>
            <option>Cancelled</option>
            <option>No Show</option>
          </select>
          
          <div class="modal-actions">
            <button type="button" id="closeModalBtn">Cancel</button>
            <button type="submit">Submit</button>
          </div>
        </form>
      </dialog>

      <!--MODAL FORM FOR LOGOUT-->
      <dialog id="logoutModal">
        <form action="/logout" method="POST" id="logoutForm">
          <h3>Are You Sure You Want Log Out?</h3>
          <div class="modal-actions">
            <button type="button" id="closeModalBtn">Cancel</button>
            <button type="submit">Yes, Log out</button>
          </div>
        </form>
      </dialog>

  </main>

  <!--FOOTER-->
  <footer>
    <p>&copy; 2026 CareConnectLite</p>
  </footer>

  <script>
    //MODAL FORM FOR LOG OUT
    const logoutModal = document.getElementById('logoutModal');
    const logoutBtn = document.getElementById('logout');
    const logoutClose = document.getElementById('closeModalBtn');
    // Open the modal
    logoutBtn.addEventListener('click', () => {
      logoutModal.showModal();
    });
    // Close the modal manually with cancel button
    logoutClose.addEventListener('click', () => {
      logoutModal.close(); 
    });


    //MODAL FOR STATUS UPDATE
    const modal = document.getElementById('inputModal');
    const openBtn = document.getElementById('updateStatus');
    const closeBtn = document.getElementById('closeModalBtn');
    const form = document.getElementById('statusForm');
    // Open the modal
    openBtn.addEventListener('click', () => {
    modal.showModal();
    });

    // Close the modal manually with cancel button
    closeBtn.addEventListener('click', () => {
    modal.close(); 
    });

    form.addEventListener('submit', (event) => {
        //get the status value that I could use to make the update
        const status = document.getElementById('appointmentStatus').value;
        alert("Appointment Status update to: " + status);
        
        // Clear the input field for next time
        form.reset();
    });

    //GET APPOINTMENT DETAILS
    //get search parameters
    const params = new URLSearchParams(window.location.search);
    const appointmentID = params.get("ID");

    async function loadAppointmentDetails(){
      const res = await fetch("/staff/appointments/details");
      const result = await res.json();
      const greeting = document.getElementById("greeting");
      const currentAppointments = document.getElementById("current-appointments")
      const currentAppointmentsDate = document.getElementById("current-appointments-date");
      
      //Retrieve successfully logged in patient info
      if(result.success){
        const user = result.user;
        greeting.innerText = `Staff Member: ${user.firstName} ${user.lastName}`
        currentAppointmentsDate.innerText = `Viewing All Appointments`;
        const appointments = result.appointments;
        //handle no appointments
        if (!appointments || appointments.length === 0) {
            currentAppointments.innerHTML = `
            <p>No Appointments Currently.</p>
            <a href="/staff/appointments">Search All Appointments</a>
          `;
          return;
        }
        //handle a list of appointments
        currentAppointments.innerHTML = appointments.filter(appt => {
          const [date, time] = appt.datetime.split(' ');
          const patientName = `${appt.patientFirstName} ${appt.patientLastName}`.toLowerCase();
          const providerName = `${appt.providerFirstName} ${appt.providerLastName}`.toLowerCase();

          return (
            params.size === 0 ||
            (!searchDate || searchDate == date) &&
            (!searchTime || `${searchTime}:00` == time) &&
            (!searchPatient || patientName.includes(searchPatient.toLowerCase())) &&
            (!searchProvider || providerName.includes(searchProvider.toLowerCase())) &&
            (!searchID || searchID == appt.appointmentID) &&
            (!searchType || searchType == appt.appointmentType) &&
            (!searchStatus || searchStatus == appt.currentStatus)
          );
        }).map(appt => {
          const [date, time] = appt.datetime.split(' ');

          return `
            <section class="appointment-details-card">
              <div>
                <strong>${appt.currentStatus}</strong>
                <ul class="left-align">
                  <li>Provider: ${appt.providerFirstName} ${appt.providerLastName}</li>
                  <li>Appointment Type: ${appt.appointmentType || 'Not selected yet'}</li>
                  <li>Date: ${date}</li>
                  <li>Time: ${time}</li>
                  <li>Patient: ${appt.patientFirstName} ${appt.patientLastName}</li>
                </ul>
              </div>
              <div>
                <button onclick""">Request Confirmation</button>
                <button onclick="">Send Intake Form</button>
                <button id="updateStatus">Update Appointment Status</button>
              </div>
            </section>
          `;
        }).join('');

      }
    }

    loadAppointmentDetails();
  </script>
</body>
</html>
