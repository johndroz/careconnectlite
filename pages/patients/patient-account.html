<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareConnectLite</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header>
    <nav>
        <a href="/">CareConnectLite</a>
        <ul>
          <li><a id="logout">Log Out</a></li>
        </ul>
    </nav>
  </header>
  <main>
    <h3 id="greeting">Hello, </h3>
    <div id="my-appointments" class="appointments-section">
    </div>

    <!--MODAL FORM FOR LOGOUT-->
    <dialog id="inputModal">
      <form action="/logout" method="POST" id="modalForm">
        <h3>Are You Sure You Want Log Out?</h3>
        <div class="modal-actions">
          <button type="button" id="closeModalBtn">Cancel</button>
          <button type="submit">Yes, Log out</button>
        </div>
      </form>
    </dialog>

  </main>

  <!--FOOTER-->
  <footer><p>&copy; 2026 CareConnectLite</p></footer>

  <script>
    //MODAL FORM FOR LOG OUT
    const modal = document.getElementById('inputModal');
    const logoutBtn = document.getElementById('logout');
    const closeBtn = document.getElementById('closeModalBtn');
    // Open the modal
    logoutBtn.addEventListener('click', () => {
    modal.showModal();
    });
    // Close the modal manually with cancel button
    closeBtn.addEventListener('click', () => {
    modal.close(); 
    });

    //GET APPOINTMENTS FOR SPECIFIC PATIENT
    async function loadPatient(){
      const res = await fetch("/patients/appointments");
      const result = await res.json();
      const greeting = document.getElementById("greeting");
      const myAppointments = document.getElementById("my-appointments")

      //Retrieve successfully logged in patient info
      if(result.success){
        const user = result.user;
        greeting.innerText = `Hello, ${user.firstName} ${user.lastName}`

        const appointments = result.appointments;
        //handle no appointments
        if (!appointments || appointments.length === 0) {
          myAppointments.innerHTML = `
            <p>No Appointments Currently.</p>
            <a href="/patients/schedule">Schedule an appointment</a>
          `;
          return;
        }
        //handle a list of appointments
        myAppointments.innerHTML = appointments.map(appt => `
          <section class="appointment-card">
            <p><strong>Status:</strong> ${appt.currentStatus}</p>
            <p><strong>Date/Time:</strong> ${appt.datetime}</p>
            <p><strong>Type:</strong> ${appt.appointmentType || 'Not selected yet'}</p>
          </section>
        `).join('');

      }
    }

    loadPatient();
  </script>
</body>
</html>
