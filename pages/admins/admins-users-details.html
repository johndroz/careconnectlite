<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareConnectLite</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header>
    <nav>
        <a href="index.html">CareConnectLite</a>
        <ul>
          <li><a href="/admins/daily">Today's Appointments</a></li>
          <li><a href="/admins/appointments">All Appointments</a></li>
          <li><a href="/admins/users">View Users</a></li>
            <li><a id="logout">Log Out</a></li>
        </ul>
    </nav>
  </header>
  <h1>Administrator: View User Details</h1>
  <div id="feedback"></div>

  <!--APPOINTMENT DETAILS-->
  <main class="user-details">
    <div id="user-details"></div>

    <!--MODAL FORM ROLE UPDATES-->
    <dialog id="roleModal">
        <form action="/admins/users/role/update" method="POST" id="roleForm">
          <h3>Update User Role</h3>
          <label for="userRole">Role: </label>
          <select type="text" id="userRole" name="userRole" required>
            <option value="1">Patient</option>
            <option value="2">Staff</option>
            <option value="3">Provider</option>
            <option value="4">Clinic Administrator</option>
          </select>
          <div class="modal-actions">
            <button type="button" id="closeRoleModalBtn">Cancel</button>
            <button type="submit">Submit</button>
          </div>
          <input type="hidden" name="ID" id="roleUserID">
        </form>
      </dialog>

      <!--MODAL FORM UPDATE USER ISACTIVE-->
      <dialog id="isActiveModal">
        <form action="/admins/users/status/update" method="POST" id="isActiveForm">
          <h3>Update User Status</h3>
          <label for="userIsActive">Active Status: </label>
          <select type="text" id="userIsActive" name="userIsActive" required>
            <option value="1">Active</option>
            <option value="0">Inactive</option>
          </select>
          <div class="modal-actions">
            <button type="button" id="closeisActiveModalBtn">Cancel</button>
            <button type="submit">Submit</button>
          </div>
          <input type="hidden" name="ID" id="isActiveUserID">
        </form>
      </dialog>

      <!--MODAL FORM FOR LOGOUT-->
      <dialog id="logoutModal">
        <form action="/logout" method="POST" id="logoutForm">
          <h3>Are You Sure You Want Log Out?</h3>
          <div class="modal-actions">
            <button type="button" id="closeModalBtn">Cancel</button>
            <button type="submit">Yes, Log out</button>
          </div>
        </form>
      </dialog>

  </main>

  <!--FOOTER-->
  <footer>
    <p>&copy; 2026 CareConnectLite</p>
  </footer>

  <script>
    //get parameters
    const params = new URLSearchParams(window.location.search);
    const userID = params.get("ID");

    //get feedback from responses
    const feedback = document.getElementById("feedback");

    //MODAL FORM FOR LOG OUT
    const logoutModal = document.getElementById('logoutModal');
    const logoutBtn = document.getElementById('logout');
    const logoutClose = document.getElementById('closeModalBtn');
    // Open the modal
    logoutBtn.addEventListener('click', () => {
      logoutModal.showModal();
    });
    // Close the modal manually with cancel button
    logoutClose.addEventListener('click', () => {
      logoutModal.close(); 
    });


    //GET APPOINTMENT DETAILS
    //get ID search parameters
    async function loadUserDetails(){
      const res = await fetch(`/admins/users/details/search?ID=${userID}`);
      const result = await res.json();
      const currentUser = document.getElementById("user-details")
      
      //Retrieve user and get current admin
      if(result.success){
        const admin = result.admin;
        const user = result.user;
        //handle no users
        if (!user || user.length === 0) {
            currentAppointment.innerHTML = `
            <p>No User Details Found.</p>
          `;
          return;
        }
        //handle user details
        currentUser.innerHTML = `
            <section class="user-details-card">
              <div>
                <strong>User ID: ${user.userID}</strong>
                <ul class="left-align">
                  <li>Full Name: ${user.firstName} ${user.lastName}</li>
                  <li>Role: ${user.roleName}</li>
                  <li>Status: ${user.isActive == 1? "Active" : "Inactive"}</li>
                </ul>
              </div>
              <div class="user-details-options">
                <button id="updateRole">Update User Role</button>
                <button id="isActiveBtn">Update User Status</button>
              </div>
            </section>
          `;

        //MODAL FOR ROLE UPDATE
        const roleModal = document.getElementById('roleModal');
        const openRoleBtn = document.getElementById('updateRole');
        const closeRoleBtn = document.getElementById('closeRoleModalBtn');
        const roleForm = document.getElementById('roleForm');
        const roleUserID = document.getElementById('roleUserID');
        //Set user ID for role updates
        roleUserID.value = userID;
        // Open the modal
        openRoleBtn.addEventListener('click', () => {
          roleModal.showModal();
        });
        // Close the modal manually with cancel button
        closeRoleBtn.addEventListener('click', () => {
          roleModal.close(); 
        });
        roleForm.addEventListener('submit', async (event) => {
            //prevent reload
            event.preventDefault();
            //update the role data and handle response
            const roleFormData = new FormData(roleForm);
            const roleData = Object.fromEntries(roleFormData);
            const res = await fetch("/admins/users/role/update", {
                method: "POST",
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({roleData})
            })
            const result = await res.json();
            if(result.success){
                alert("Updated user's role successfully.");
                window.location.reload();
            } else{
                feedback.innerText = "Failed to update user's role."
            }
        });

        //MODAL FOR UPDATE ISACTIVE
        const isActiveModal = document.getElementById('isActiveModal');
        const isActiveBtn = document.getElementById('isActiveBtn');
        const isActiveClose = document.getElementById('closeisActiveModalBtn');
        const isActiveForm = document.getElementById('isActiveForm');
        const isActiveUserID = document.getElementById('isActiveUserID');
        //Set user ID for isActive updates
        isActiveUserID.value = userID;
        // Open the modal
        isActiveBtn.addEventListener('click', () => {
            isActiveModal.showModal();
        });
        // Close the modal manually with cancel button
        isActiveClose.addEventListener('click', () => {
            isActiveModal.close(); 
        });
        isActiveForm.addEventListener('submit', async (event) => {
            //prevent reload
            event.preventDefault();
            //update status data and handle response
            const isActiveFormData = new FormData(isActiveForm);
            const isActiveData = Object.fromEntries(isActiveFormData);
            const res = await fetch("/admins/users/status/update", {
                method: "POST",
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({isActiveData})
            })
            const result = await res.json();
            if(result.success){
                alert("Updated user's status successfully.");
                window.location.reload();
            } else{
                feedback.innerText = "Failed to update user's status."
            }
        });

      }
    }

    loadUserDetails();

  </script>
</body>
</html>
